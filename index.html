<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arnav raja</title>
<meta name="description" content="Time only passes here when you are still.">
<meta name="theme-color" content="#d9d7d0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d9d7d0'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #d9d7d0; --ink: #000; --g: clamp(16px, 3.5vw, 44px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", system-ui, sans-serif;
    overflow: hidden;
    cursor: default;
  }
  .count {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    margin: 0;
    font-weight: 200;
    font-size: clamp(120px, 34vw, 520px);
    letter-spacing: -0.06em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    user-select: none;
    transition: opacity 1.2s ease;
  }
  body.moving .count { opacity: .16; transition: opacity .25s ease; }
  .door {
    position: fixed;
    font-weight: 500;
    font-size: clamp(18px, 1.6vw, 24px);
    color: var(--ink);
    text-decoration: none;
    opacity: 0;
    transition: opacity 2.4s ease;
  }
  .name { top: var(--g); left: var(--g); }
  .blog { bottom: var(--g); left: var(--g); }
  .stuff { bottom: var(--g); right: var(--g); }
  body.still .door, .door:focus-visible { opacity: 1; }
  body.moving .door { opacity: 0; transition: opacity .2s ease; }
  .door:hover { text-decoration: underline; text-underline-offset: .2em; }
  .door:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; opacity: 1; }
  .ask {
    position: fixed; top: var(--g); right: var(--g);
    margin: 0;
    font-weight: 500;
    font-size: clamp(14px, 1.2vw, 17px);
    transition: opacity .6s ease;
  }
  body.still .ask { opacity: 0; transition: opacity 2s ease; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="moving">
<h1 class="sr">Arnav Raja</h1>
<p class="count" id="count" aria-hidden="true">0</p>
<p class="ask" id="ask">Be still.</p>
<span class="door name" aria-hidden="true">arnav raja</span>
<a class="door blog" href="https://blog.arnavraja.in">blog</a>
<a class="door stuff" href="https://stuff.arnavraja.in">stuff</a>
<script>
(() => {
  // Seconds only pass while you are still. They are kept between visits.
  const KEY = "stillness";
  let total = 0;
  try { total = +localStorage.getItem(KEY) || 0; } catch (e) {}
  const count = document.getElementById("count");
  const body = document.body;
  let last = performance.now(), prev = last, saved = 0;
  const STILL = 900, REVEAL = 2600;

  const stir = e => {
    if (e && e.type === "keydown" && (e.key === "Tab" || e.key === "Enter" || e.key === "Shift")) return;
    last = performance.now();
    body.classList.add("moving");
    body.classList.remove("still");
  };
  ["pointermove", "pointerdown", "wheel", "keydown", "touchstart", "scroll"].forEach(t => addEventListener(t, stir, { passive: true }));
  addEventListener("deviceorientation", e => {
    const v = Math.abs(e.beta || 0) + Math.abs(e.gamma || 0);
    if (Math.abs(v - (stir.v || v)) > 4) stir();
    stir.v = v;
  });
  const save = () => { try { localStorage.setItem(KEY, String(total)); } catch (e) {} };
  document.addEventListener("visibilitychange", () => { prev = performance.now(); save(); });
  addEventListener("pagehide", save);

  const show = () => { count.textContent = Math.floor(total).toLocaleString("en-US"); };
  show();
  const tick = now => {
    const idle = now - last, dt = Math.min(250, now - prev);
    prev = now;
    if (idle > STILL && !document.hidden) {
      body.classList.remove("moving");
      total += dt / 1000;
      show();
      if (now - saved > 1000) { saved = now; try { localStorage.setItem(KEY, String(total)); } catch (e) {} }
    }
    body.classList.toggle("still", idle > REVEAL);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
